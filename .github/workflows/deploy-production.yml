name: Deploy to production

run-name: task87-48f9273e96924437833f deploy-production ${{ github.ref_name }}

on:
  push:
    tags:
      - 'bench87/48f9273e96924437833f/**'

permissions:
  contents: read

concurrency:
  group: task87-48f9273e96924437833f-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to prod-server (requires approval)
    runs-on:
      - self-hosted
      - task87-48f9273e96924437833f
    environment: task87-48f9273e96924437833f-production
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static checks
        run: python3 -m compileall -q app microblog.py config.py

      - name: Deploy to prod-server
        env:
          TASK87_SSH_KEY: ${{ secrets.TASK87_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TASK87_SSH_KEY" > "$HOME/.ssh/id_task87"
          chmod 600 "$HOME/.ssh/id_task87"
          export SSH_IDENTITY_FILE="$HOME/.ssh/id_task87"
          if [[ -n "${PROD_USER:-}" ]]; then
            target="${PROD_USER}@${PROD_HOST}"
          else
            target="$PROD_HOST"
          fi
          version="task87-48f9273e96924437833f-prod-run${GITHUB_RUN_ID}-sha-$(git rev-parse --short=8 HEAD)"
          echo "Deploying ${version} to ${target}"
          scripts/deploy.sh "$target" "$version"
          {
            echo "### Deployed to prod-server"
            echo "- version: \`${version}\`"
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
